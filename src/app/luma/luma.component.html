<!-- Fenster -->
<div *ngIf="windowService.lumaWindowState !== 'minimized'">
  <div
    cdkDrag
    (mousedown)="windowService.activeWindow = 'luma'"
    class="window"
    [ngStyle]="{
      'top.px': 50,
      'left.px': 300,
    }"
    [ngClass]="{
      active: windowService.activeWindow === 'luma',
      maximized: windowService.lumaWindowMaximized,
    }"
  >
    <div class="window-banner">
      <div class="window-title">
        <img src="projects.png" class="responsive-img" />
        Luma Prozess
      </div>
      <div>
        <button (click)="onMinimize()"><img src="minimize.png" /></button>
        <button (click)="onToggleMaximize()"><img src="maximize.png" /></button>
        <button (click)="onClose()"><img src="close.png" /></button>
      </div>
    </div>
    <div class="project-container">
      <h1>Luma Prozess Details</h1>

      <h3>Schritt 1: Nachforschung</h3>
      <h3>Schritt 2: User Interviews & Personas</h3>
      <h3>Schritt 3: Moodboard</h3>
      <img src="luma_moodboard.png" class="picture" />
      <h3>Schritt 4: Prototyping</h3>
      <h3>Schritt 5: Image video (meine Hauptrolle)</h3>
      <div class="content"></div>
    </div>
  </div>
</div>
